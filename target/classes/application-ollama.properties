# =============================================
# Profile: ollama
# Activates Ollama as the default LLM provider
# and disables OpenAI auto-configuration.
# =============================================

# Disable OpenAI auto-configuration (no API key needed)
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration

# Override defaults to use Ollama
hedgefund.default-model-provider=OLLAMA
hedgefund.default-model-name=${OLLAMA_MODEL:qwen3:30b}

