# =============================================
# AI Hedge Fund - Spring Boot Configuration
# =============================================

server.port=8080

# --- OpenAI (default provider) ---
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=gpt-4.1
spring.ai.openai.chat.options.temperature=0.1
spring.ai.openai.connect-timeout=30s
spring.ai.openai.read-timeout=120s

# --- Ollama (local LLMs) ---
# Point to your running Ollama instance. Start Ollama with: ollama serve
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
# Default Ollama model (must be pulled first: ollama pull llama3)
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:llama3}
spring.ai.ollama.chat.options.temperature=0.1
# Set to false so the app starts even if Ollama is not running
spring.ai.ollama.init.pull-model-strategy=never
# Increase timeouts for large local models (30B+ need more time)
spring.ai.ollama.init.timeout=600s
spring.ai.ollama.chat.options.keep-alive=600s

# --- Financial Data Provider ---
# Switch between providers: "financial-datasets" (default) or "eodhd"
financial.data.provider=${FINANCIAL_DATA_PROVIDER:eodhd}

# --- Financial Datasets API (https://financialdatasets.ai) ---
financial.datasets.api-key=${FINANCIAL_DATASETS_API_KEY:}
financial.datasets.base-url=https://api.financialdatasets.ai

# --- EODHD API (https://eodhd.com) ---
eodhd.api-token=69b64848a094a3.97240494
eodhd.base-url=https://eodhd.com/api
# Default exchange suffix for bare tickers (e.g. US, SG, LSE, TO)
# Set to SG for Singapore (SGX) stocks, US for US stocks, etc.
eodhd.default-exchange=${EODHD_DEFAULT_EXCHANGE:US}

# --- MarketAux News Sentiment API (https://www.marketaux.com) ---
marketaux.api-token=${MARKETAUX_API_TOKEN:oSIYSV70luiUJSivty84F7Ys5Vm8NFohkCrrTPGA}
marketaux.base-url=https://api.marketaux.com/v1
marketaux.default-limit=50

# --- Hedge Fund defaults ---
hedgefund.default-model-provider=OPENAI
hedgefund.default-model-name=gpt-4.1
hedgefund.initial-cash=100000.0
hedgefund.margin-requirement=0.5
hedgefund.max-llm-retries=3

# --- Analysis Persistence (MySQL) ---
# Set to true to store analysis results in MySQL for historical review
# When false (default), app starts without any database dependency
hedgefund.persistence.enabled=${HEDGE_PERSISTENCE_ENABLED:true}

# MySQL connection (only used when hedgefund.persistence.enabled=true)
spring.datasource.url=${HEDGE_DB_URL:jdbc:mysql://localhost:3306/hedgefund?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${HEDGE_DB_USER:root}
spring.datasource.password=${HEDGE_DB_PASS:Rsaucm123$}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- Cache (Caffeine) ---
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=3600s

# --- Logging ---
logging.level.com.hedgefund.ai=INFO
logging.level.org.springframework.ai=WARN

