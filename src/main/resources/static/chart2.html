<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Institutional Trend & Cycle Chart</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0}
  header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#1e293b;border-bottom:1px solid #334155}
  input,select,button{padding:7px 10px;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#e2e8f0}
  button{background:#10b981;border:0;font-weight:600;cursor:pointer}
  button:hover{background:#059669}
  label{font-size:13px;color:#94a3b8;white-space:nowrap;display:flex;align-items:center;gap:4px;cursor:pointer}
  #wrap{position:relative}
  #chart{height:calc(100vh - 56px)}
  #dash{position:absolute;top:10px;left:10px;z-index:5;background:rgba(15,23,42,.92);border:1px solid #334155;
        border-radius:8px;font-size:12px;min-width:280px;box-shadow:0 4px 16px rgba(0,0,0,.45);overflow:hidden}
  .dash-hdr{padding:6px 12px;background:#1e293b;font-weight:700;color:#38bdf8;font-size:11px;letter-spacing:.5px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
  .dash-sec{padding:4px 12px;background:#1e293b;font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.4px;border-top:1px solid #334155}
  #dash div.row{display:flex;justify-content:space-between;gap:12px;padding:3px 12px}
  #dash b{padding:1px 6px;border-radius:3px;color:#fff;font-size:11px}
  .g{background:#16a34a}.r{background:#dc2626}.n{background:#64748b}.o{background:#f97316}.a{background:#06b6d4}.l{background:#84cc16}.p{background:#a855f7}.y{background:#eab308;color:#000!important}
  #alertBox{position:absolute;top:10px;right:10px;z-index:5;font-size:12px;max-width:340px}
  .alert-badge{padding:6px 12px;border-radius:6px;margin-bottom:6px;font-weight:600;display:none;box-shadow:0 2px 8px rgba(0,0,0,.4)}
  #msg{position:absolute;bottom:34px;left:10px;z-index:5;font-size:13px;color:#fbbf24}
  .nav-btn{color:#38bdf8;font-size:13px;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<header>
  <input id="t" value="AAPL" size="8">
  <select id="tf" title="Candle timeframe">
    <option value="5m">5 min</option><option value="15m">15 min</option><option value="1h">1 hour</option>
    <option value="4h">4 hour</option><option value="1D" selected>1 day</option>
  </select>
  <select id="d" title="History range"></select>
  <select id="p" title="Preset"><option value="swing">Swing</option><option value="intraday">Intraday</option><option value="position">Position</option></select>
  <label><input type="checkbox" id="e20" checked><span style="color:#f97316">●</span> EMA 20</label>
  <label><input type="checkbox" id="e50" checked><span style="color:#ffffff">●</span> EMA 50</label>
  <label><input type="checkbox" id="e200" checked><span style="color:#3b82f6">●</span> EMA 200</label>
  <label><input type="checkbox" id="ts" checked><span style="color:#ef4444">●</span> Trail Stop</label>
  <label><input type="checkbox" id="sr" checked> S/R Zones</label>
  <label><input type="checkbox" id="buys" checked> Buy Signals</label>
  <label><input type="checkbox" id="sells" checked> Sell Signals</label>
  <label><input type="checkbox" id="div" checked> Divergences</label>
  <label><input type="checkbox" id="bo" checked> Traps & BO</label>
  <label><input type="checkbox" id="setup" checked> ATR Setup (1:2 R:R)</label>
  <button id="go">Load</button>
  <a href="/chart.html" class="nav-btn">← Confluence Chart</a>
  <a href="/" style="color:#94a3b8;font-size:13px;text-decoration:none">← Dashboard</a>
</header>
<div id="wrap">
  <div id="msg"></div>
  <div id="dash"></div>
  <div id="alertBox">
    <div id="scoreAlert" class="alert-badge g">STRONG BUY</div>
    <div id="buyAlert" class="alert-badge g">BUY ALERT</div>
    <div id="divAlert" class="alert-badge y">DIVERGENCE ALERT</div>
    <div id="trapAlert" class="alert-badge o">TRAP ALERT</div>
    <div id="tpAlert" class="alert-badge o">TAKE PROFIT ALERT</div>
    <div id="exitAlert" class="alert-badge r">TREND EXIT ALERT</div>
  </div>
  <div id="chart"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const chart=LightweightCharts.createChart($('chart'),{
  layout:{background:{color:'#0f172a'},textColor:'#cbd5e1'},
  grid:{vertLines:{color:'#1e293b'},horzLines:{color:'#1e293b'}},
  timeScale:{borderColor:'#334155'},rightPriceScale:{borderColor:'#334155'},
  crosshair:{mode:LightweightCharts.CrosshairMode.Normal}});
new ResizeObserver(()=>chart.applyOptions({width:$('chart').clientWidth,height:$('chart').clientHeight})).observe($('chart'));

const candle=chart.addCandlestickSeries({upColor:'#22c55e',downColor:'#ef4444',borderVisible:false,wickUpColor:'#22c55e',wickDownColor:'#ef4444'});
const vol=chart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'vol'});
chart.priceScale('vol').applyOptions({scaleMargins:{top:.82,bottom:0}});

const line=(color,w=1,style=0)=>chart.addLineSeries({color,lineWidth:w,lineStyle:style,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
const ema20Line=line('#f97316',2);
const ema50Line=line('#ffffff',2);
const ema200Line=line('#3b82f6',2);
const trailStopLine=line('#ef4444',2,2);
const resLine=line('rgba(239,68,68,0.75)',1,2);
const supLine=line('rgba(34,197,94,0.75)',1,2);
let setupLines=[],data=null;

const T=t=>/^\d+$/.test(t)?Number(t):t;
const RANGES={'5m':[['5 days',5],['10 days',10],['30 days',30],['100 days',100]],
  '15m':[['10 days',10],['30 days',30],['60 days',60],['100 days',100]],
  '1h':[['30 days',30],['90 days',90],['180 days',180],['1 year',365]],
  '4h':[['90 days',90],['180 days',180],['1 year',365],['500 days',500]],
  '1D':[['1 year',365],['2 years',730],['5 years',1825]]};
const DEFAULT={'5m':10,'15m':30,'1h':90,'4h':365,'1D':730};
function fillRanges(){
  const tf=$('tf').value;
  $('d').innerHTML=RANGES[tf].map(([l,v])=>`<option value="${v}" ${v==DEFAULT[tf]?'selected':''}>${l}</option>`).join('');
  chart.applyOptions({timeScale:{timeVisible:tf!=='1D',secondsVisible:false}});
}

const pairs=(c,arr)=>arr?c.map((x,i)=>arr[i]==null?null:{time:T(x.time),value:arr[i]}).filter(Boolean):[];
const cls=s=>/BULL|BUY/.test(s)?'g':/BREAKOUT/.test(s)?'a':/EARLY/.test(s)?'l':/PARTIAL|TAKE/.test(s)?'o':/BEAR|SELL|EXIT/.test(s)?'r':'n';

function markerStyle(m){
  switch(m.type){
    case 'INST_EARLY_BUY':return{position:'belowBar',shape:'arrowUp',color:'#84cc16',text:'EARLY BUY',size:2};
    case 'INST_BUY':return{position:'belowBar',shape:'arrowUp',color:'#22c55e',text:'BUY',size:2};
    case 'INST_BREAKOUT':return{position:'belowBar',shape:'arrowUp',color:'#06b6d4',text:'BREAKOUT',size:2};
    case 'INST_BREAKDOWN':return{position:'aboveBar',shape:'arrowDown',color:'#f97316',text:'BREAKDOWN',size:2};
    case 'INST_BULL_TRAP':return{position:'aboveBar',shape:'square',color:'#ef4444',text:'BULL TRAP',size:2};
    case 'INST_BEAR_TRAP':return{position:'belowBar',shape:'square',color:'#22c55e',text:'BEAR TRAP',size:2};
    case 'INST_BULL_DIV':return{position:'belowBar',shape:'circle',color:'#eab308',text:'BULL DIV',size:1};
    case 'INST_BEAR_DIV':return{position:'aboveBar',shape:'circle',color:'#a855f7',text:'BEAR DIV',size:1};
    case 'INST_TAKE_PROFIT':return{position:'aboveBar',shape:'arrowDown',color:'#f97316',text:'PARTIAL SELL',size:2};
    case 'INST_EXIT':return{position:'aboveBar',shape:'arrowDown',color:'#ef4444',text:'EXIT',size:2};
  }
  return null;
}

function redraw(){
  if(!data||!data.institutional)return;
  const show=id=>$(id)?$(id).checked:false;
  const inst=data.institutional;
  ema20Line.setData(show('e20')?pairs(data.candles,inst.ema20):[]);
  ema50Line.setData(show('e50')?pairs(data.candles,inst.ema50):[]);
  ema200Line.setData(show('e200')?pairs(data.candles,inst.ema200):[]);
  trailStopLine.setData(show('ts')?pairs(data.candles,inst.trailStop):[]);
  resLine.setData(show('sr')?pairs(data.candles,inst.upperResistance):[]);
  supLine.setData(show('sr')?pairs(data.candles,inst.lowerSupport):[]);

  const ms=(inst.markers||[]).filter(m=>{
    const isBuy=m.type==='INST_EARLY_BUY'||m.type==='INST_BUY'||m.type==='INST_BREAKOUT';
    const isSell=m.type==='INST_TAKE_PROFIT'||m.type==='INST_EXIT'||m.type==='INST_BREAKDOWN';
    const isDiv=m.type==='INST_BULL_DIV'||m.type==='INST_BEAR_DIV';
    const isTrap=m.type==='INST_BULL_TRAP'||m.type==='INST_BEAR_TRAP';
    if(isBuy&&!show('buys'))return false;
    if(isSell&&!show('sells'))return false;
    if(isDiv&&!show('div'))return false;
    if(isTrap&&!show('bo'))return false;
    return markerStyle(m)!=null;
  }).map(m=>({time:T(m.time),...markerStyle(m)}));

  ms.sort((a,b)=>a.time<b.time?-1:a.time>b.time?1:0);
  candle.setMarkers(ms);

  // ATR-based trade setup lines (Entry, SL, TP1, TP2 1:2 R:R, TP3 1:3 R:R)
  setupLines.forEach(s=>chart.removeSeries(s));setupLines=[];
  if(show('setup')&&inst.summary&&data.candles.length>=2){
    const s=inst.summary;
    const last=data.candles[data.candles.length-1].time;
    const start=data.candles[Math.max(0,data.candles.length-4)].time;
    const curPx=data.candles[data.candles.length-1].close;
    [[curPx,'#38bdf8',0,'Entry'],[s.atrStopLoss,'#ef4444',2,'SL'],[s.atrTakeProfit1,'#86efac',2,'TP1 (1:1)'],
     [s.atrTakeProfit2,'#22c55e',0,'TP2 (1:2 Min)'],[s.atrTakeProfit3,'#15803d',2,'TP3 (1:3)']
    ].forEach(([v,c,st,tag])=>{
      const l=line(c,st==0?2:1,st);
      l.setData([{time:T(start),value:v},{time:T(last),value:v}]);
      setupLines.push(l);
    });
  }
}

function dash(is){
  if(!is)return;
  const row=(k,v,c)=>`<div class="row"><span>${k}</span><b class="${c}">${v}</b></div>`;
  const sec=title=>`<div class="dash-sec">${title}</div>`;

  let h=`<div class="dash-hdr"><span>Institutional Analysis</span><b class="${cls(is.scoreRecommendation)}">${is.scoreRecommendation}</b></div>`;

  h+=sec('Confluence Scoring & Signals');
  h+=row('Institutional Score',`${is.bullScore.toFixed(0)} Bull / ${is.bearScore.toFixed(0)} Bear`,is.bullScore>=70?'g':is.bearScore>=70?'r':'n');
  h+=row('Rating',is.scoreRecommendation,cls(is.scoreRecommendation));
  h+=row('Cycle Signal',is.latestSignal,cls(is.latestSignal));

  h+=sec('Multi-Timeframe Trend Confirmation');
  h+=row('HTF Trend',is.htfTrend,cls(is.htfTrend));
  h+=row('HTF Confirmation',is.htfConfirmed?'CONFIRMED ✓':'CONFLICT ✗',is.htfConfirmed?'g':'r');

  h+=sec('Trend & Momentum');
  h+=row('Trend State',is.bullTrend?'BULL TREND':'NEUTRAL',is.bullTrend?'g':'n');
  h+=row('RSI (14)',is.rsi.toFixed(1),is.rsi>50?'g':is.rsi<45?'r':'n');
  h+=row('ADX (14)',is.adx.toFixed(1)+(is.adx>18?' (Trending)':' (Chop)'),is.adx>18?'g':'n');
  h+=row('MACD Hist',is.macdHist.toFixed(2),is.macdHist>0?'g':'r');

  h+=sec('Volume, Divergence & Traps');
  h+=row('RVOL',is.rvol.toFixed(2)+'x '+(is.rvol>=1.2?'(Strong)':''),is.rvol>=1.2?'g':'n');
  h+=row('Divergence',is.divergence,is.divergence==='BULLISH'?'g':is.divergence==='BEARISH'?'r':'n');
  h+=row('Breakout / Trap',is.breakoutStatus,is.breakoutStatus.includes('Trap')?'o':is.breakoutStatus.includes('BREAKOUT')?'a':'n');

  h+=sec('S/R Zones & ATR Setup (Min 1:2 R:R)');
  h+=row('Resistance Zone','$'+is.nearestResistance.toFixed(2),'r');
  h+=row('Support Zone','$'+is.nearestSupport.toFixed(2),'g');
  h+=row('ATR Stop Loss','$'+is.atrStopLoss.toFixed(2)+' (R: $'+is.plannedRisk.toFixed(2)+')','r');
  h+=row('TP2 (Min 1:2 R:R)','$'+is.atrTakeProfit2.toFixed(2)+' (1:2.0x | +$'+is.plannedReward.toFixed(2)+')','g');
  h+=row('TP3 (1:3 Runner)','$'+is.atrTakeProfit3.toFixed(2)+' (1:3.0x)','g');
  h+=row('ATR Trailing Stop',is.trailStop>0?'$'+is.trailStop.toFixed(2):'N/A',is.trailStop>0?'r':'n');

  $('dash').innerHTML=h;

  // Alert triggers
  $('scoreAlert').style.display=is.scoreRecommendation.includes('STRONG')?'block':'none';
  if(is.scoreRecommendation.includes('STRONG')){
    $('scoreAlert').className='alert-badge '+(is.scoreRecommendation.includes('BUY')?'g':'r');
    $('scoreAlert').textContent=`RATING ALERT: ${is.scoreRecommendation} on ${data.ticker} (${is.bullScore.toFixed(0)} Bull / ${is.bearScore.toFixed(0)} Bear)`;
  }

  $('buyAlert').style.display=(is.earlyBuy||is.pullbackBuy||is.breakoutBuy)?'block':'none';
  if(is.earlyBuy||is.pullbackBuy||is.breakoutBuy){
    $('buyAlert').textContent=`BUY ALERT: Potential BUY signal on ${data.ticker}`;
  }

  $('divAlert').style.display=is.divergence!=='NONE'?'block':'none';
  if(is.divergence!=='NONE'){
    $('divAlert').textContent=`DIVERGENCE ALERT: ${is.divergence} divergence detected`;
  }

  $('trapAlert').style.display=is.breakoutStatus.includes('Trap')?'block':'none';
  if(is.breakoutStatus.includes('Trap')){
    $('trapAlert').textContent=`TRAP ALERT: ${is.breakoutStatus}`;
  }

  $('tpAlert').style.display=is.takeProfit?'block':'none';
  if(is.takeProfit){
    $('tpAlert').textContent=`TAKE PROFIT ALERT: Extended price with weakening momentum`;
  }

  $('exitAlert').style.display=is.trendExit?'block':'none';
  if(is.trendExit){
    $('exitAlert').textContent=`EXIT ALERT: Trend breakdown below EMA 50`;
  }
}

async function load(){
  $('msg').textContent='Loading…';$('go').disabled=true;
  try{
    const r=await fetch(`/api/chart/${encodeURIComponent($('t').value.trim())}?timeframe=${$('tf').value}&days=${$('d').value}&preset=${$('p').value}`);
    if(!r.ok){let m='HTTP '+r.status;try{m=(await r.json()).message||m}catch(_){}throw new Error(m)}
    data=await r.json();
    candle.setData(data.candles.map(c=>({time:T(c.time),open:c.open,high:c.high,low:c.low,close:c.close})));

    // Color volume by RVOL and candle direction
    const inst=data.institutional;
    vol.setData(data.candles.map((c,i)=>{
      const rv=(inst&&inst.rvol&&inst.rvol[i]!=null)?inst.rvol[i]:1.0;
      const isUp=c.close>=c.open;
      const color=rv>=2.0?(isUp?'rgba(168,85,247,.8)':'rgba(234,179,8,.8)')
        :rv>=1.2?(isUp?'rgba(34,197,94,.75)':'rgba(239,68,68,.75)')
        :(isUp?'rgba(34,197,94,.35)':'rgba(239,68,68,.35)');
      return {time:T(c.time),value:c.volume,color};
    }));

    redraw();
    if(data.institutional)dash(data.institutional.summary);
    chart.timeScale().fitContent();
    $('msg').textContent=data.summary.warning||'';
  }catch(e){$('msg').textContent='Error: '+e.message}
  $('go').disabled=false;
}
$('go').onclick=load;
$('tf').onchange=()=>{fillRanges();load()};
$('p').onchange=load;$('d').onchange=load;
['e20','e50','e200','ts','sr','buys','sells','div','bo','setup'].forEach(id=>{if($(id))$(id).onchange=redraw;});
$('t').addEventListener('keydown',e=>{if(e.key==='Enter')load()});
fillRanges();load();
</script>
</body>
</html>
