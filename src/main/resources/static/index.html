<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Hedge Fund Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:24px}
  h1{margin:0 0 16px}
  form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
  input,button{padding:10px 12px;border-radius:6px;border:1px solid #334155;background:#1e293b;color:#e2e8f0}
  input{width:280px}
  button{background:#3b82f6;border:0;cursor:pointer;font-weight:600}
  button:disabled{opacity:.5}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
  .card{background:#1e293b;border-radius:10px;padding:16px}
  .badge{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:700;font-size:14px}
  .buy,.bullish,.cover{background:#16a34a}.sell,.bearish,.short{background:#dc2626}.hold,.neutral{background:#64748b}
  .row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #334155;font-size:14px}
  .bar{height:6px;background:#334155;border-radius:3px;width:80px;display:inline-block;vertical-align:middle;margin-left:6px}
  .bar i{display:block;height:100%;background:#3b82f6;border-radius:3px}
  .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .reason{font-size:13px;color:#94a3b8;margin:8px 0 12px}
  #status{margin-bottom:16px;color:#94a3b8}
  .summary{font-size:13px;margin:8px 0}
</style>
</head>
<body>
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:12px">
  <h1 style="margin:0">📈 AI Hedge Fund – Buy/Sell Signals</h1>
  <div style="display:flex;gap:16px">
    <a href="/chart.html" style="color:#38bdf8;text-decoration:none;font-weight:600">📊 Confluence Chart</a>
    <a href="/chart2.html" style="color:#10b981;text-decoration:none;font-weight:600">🏛️ Institutional Trend & Cycle Chart</a>
  </div>
</div>
<form id="f">
  <input id="tickers" placeholder="Tickers, e.g. AAPL, MSFT" value="AAPL" required>
  <button id="go">Analyze</button>
</form>
<div id="status"></div>
<div class="grid" id="out"></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cls=s=>String(s||'neutral').toLowerCase();
const pct=c=>{c=Number(c)||0;return c<=1?c*100:c};
const txt=r=>typeof r==='string'?r:JSON.stringify(r);

document.getElementById('f').onsubmit=async e=>{
  e.preventDefault();
  const tickers=document.getElementById('tickers').value.split(/[\s,]+/).filter(Boolean).map(t=>t.toUpperCase());
  const btn=document.getElementById('go'),st=document.getElementById('status'),out=document.getElementById('out');
  btn.disabled=true;out.innerHTML='';st.textContent='Running analysis… this can take a while.';
  const end=new Date(),start=new Date();start.setMonth(start.getMonth()-3);
  const d=x=>x.toISOString().slice(0,10);
  try{
    const r=await fetch('/api/hedge-fund/run',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({tickers,startDate:d(start),endDate:d(end)})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    render(await r.json(),tickers);st.textContent='';
  }catch(err){st.textContent='Error: '+err.message}
  btn.disabled=false;
};

function render(data,tickers){
  const out=document.getElementById('out');
  const keys=Object.keys(data.decisions||{});
  (keys.length?keys:tickers).forEach(t=>{
    const dec=(data.decisions||{})[t]||{};
    const sigs=(data.analystSignals||{})[t]||{};
    const list=Object.entries(sigs);
    const count={};list.forEach(([,s])=>{const k=cls(s.signal);count[k]=(count[k]||0)+1});
    out.insertAdjacentHTML('beforeend',`
    <div class="card">
      <div class="head"><h2 style="margin:0">${esc(t)}</h2>
        <span class="badge ${cls(dec.action)}">${esc((dec.action||'n/a').toUpperCase())}</span></div>
      <div class="summary">Qty: <b>${esc(dec.quantity??'-')}</b> · Confidence: <b>${esc(dec.confidence??'-')}%</b></div>
      <div class="summary">${Object.entries(count).map(([k,v])=>`<span class="badge ${k}">${v} ${esc(k)}</span>`).join(' ')}</div>
      <div class="reason">${esc(dec.reasoning||'')}</div>
      ${list.map(([a,s])=>`<div class="row" title="${esc(txt(s.reasoning))}">
        <span>${esc(a.replace(/_agent$/,'').replace(/_/g,' '))}</span>
        <span><span class="badge ${cls(s.signal)}">${esc(String(s.signal).toUpperCase())}</span>
        <span class="bar"><i style="width:${pct(s.confidence)}%"></i></span></span></div>`).join('')}
    </div>`);
  });
}
</script>
</body>
</html>
